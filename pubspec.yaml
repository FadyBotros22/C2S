name: c2s
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1

  retrofit: ^4.0.1
  json_annotation: ^4.9.0
  dio: ^5.0.3
  shared_preferences: 2.3.2
  intl: ^0.19.0
  image_picker: ^1.1.2
  pretty_dio_logger: ^1.4.0
  path_provider: ^2.0.0
  flutter_image_compress: ^2.3.0
  amplify_flutter: ^2.4.0
  amplify_auth_cognito: ^2.4.0
  amplify_storage_s3: ^2.4.0
  firebase_core: ^3.4.0
  get_it: ^8.0.1
  flutter_bloc: ^8.1.6
  flutter_native_splash: ^2.4.2

flutter_native_splash:
  color: "#ffffff"
  image: images/logo.png
  android: true
  ios: true
#  fullscreen: true
  android_gravity: center
  ios_content_mode: scaleAspectFit


dev_dependencies:
  build_runner: ^2.3.3
  retrofit_generator: ^9.0.1
  json_serializable: ^6.6.2

  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  assets:
    - images/
    - assets/icons/

  fonts:
    - family: SF Pro Display
      fonts:
        - asset: fonts/sf_pro_display/SF-Pro-Display-Thin.otf
          weight: 100
        - asset: fonts/sf_pro_display/SF-Pro-Display-Ultralight.otf
          weight: 200
        - asset: fonts/sf_pro_display/SF-Pro-Display-Light.otf
          weight: 300
        - asset: fonts/sf_pro_display/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: fonts/sf_pro_display/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: fonts/sf_pro_display/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: fonts/sf_pro_display/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: fonts/sf_pro_display/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: fonts/sf_pro_display/SF-Pro-Display-Black.otf
          weight: 900

    - family: Roboto
      fonts:
        - asset: fonts/Roboto/Roboto-Regular.ttf